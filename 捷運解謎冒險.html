<style>
  :root {
    --bg: #0C0A1C; --bg-deep: #07060F; --bg-glow: #1B1240; --bg2: #120E2B;
    --panel: #1A1440; --line: #382C73; --portal: #6A5ACD; --cyan: #00C8FF;

    --fp: 'Press Start 2P', 'Noto Sans TC', monospace;

    --fm: ui-monospace, 'SF Mono', monospace;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: radial-gradient(1200px 700px at 50% -10%, var(--bg-glow) 0%, transparent 60%), var(--bg-deep); font-family: var(--fd); color: var(--ink); -webkit-font-smoothing: antialiased; letter-spacing: 0.01em; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  #stage { transform-origin: center; }
  .scroll::-webkit-scrollbar { width: 0; height: 0; }
  .scroll { scrollbar-width: none; }
  .placeholder-art { background: repeating-linear-gradient(45deg, rgba(106,90,205,.16) 0 10px, rgba(0,200,255,.07) 10px 20px), var(--bg2); border: 1px solid var(--line); }
  .boss-bg { background: radial-gradient(700px 400px at 50% 30%, rgba(255,77,109,.16), transparent 70%), repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px), var(--bg); }
  .victory-bg { background: radial-gradient(700px 500px at 50% 40%, rgba(255,215,0,.18), transparent 70%), var(--bg); }
  .cam-feed { background: radial-gradient(500px 500px at 50% 45%, #16203a, #07060F), repeating-linear-gradient(0deg, rgba(0,200,255,.04) 0 3px, transparent 3px 6px); }
  .podium-1 { box-shadow: 0 0 24px rgba(255,215,0,.45), inset 0 0 12px rgba(255,215,0,.15); }
  .podium-2 { box-shadow: 0 0 14px rgba(192,192,192,.3); }
  .podium-3 { box-shadow: 0 0 10px rgba(205,127,50,.3); }

  @keyframes portalSpin { to { transform: rotate(360deg); } }
  @keyframes portalPulse { 0%,100% { transform: scale(.92); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes spark { 0%,100% { transform: translateY(0) scale(1); opacity: .4; } 50% { transform: translateY(-14px) scale(1.3); opacity: 1; } }
  @keyframes nodePulse { 0% { transform: scale(.9); opacity: .8; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes scanMove { 0% { top: 6px; } 50% { top: calc(100% - 9px); } 100% { top: 6px; } }
  @keyframes recBlink { 0%,100% { opacity: 1; } 50% { opacity: .2; } }
  @keyframes qrFound { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
  @keyframes bossIdle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  @keyframes weakGlow { 0%,100% { filter: brightness(1.1); } 50% { filter: brightness(1.5); } }
  @keyframes weakFlash { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  @keyframes dmgFloat { 0% { transform: translateY(0) scale(.6); opacity: 0; } 20% { opacity: 1; transform: translateY(-6px) scale(1.15); } 100% { transform: translateY(-60px) scale(1); opacity: 0; } }

  @keyframes sigilDrop { 0% { transform: translateY(-40px) scale(.4); opacity: 0; } 60% { transform: translateY(8px) scale(1.15); opacity: 1; } 100% { transform: translateY(0) scale(1); } }
  @keyframes overlayIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes storyIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  @keyframes caretBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes gateShake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @keyframes iosLock { 0%,100% { transform: rotate(0deg); } 30%,60% { transform: rotate(8deg); } 15%,45%,75% { transform: rotate(-8deg); } }

  .portal-ring { will-change: transform; }
  .portal-spark { will-change: transform; }
  .node-pulse { animation: nodePulse 1.8s ease-out infinite; }
  .scan-line { animation: scanMove 2s ease-in-out infinite; }
  .rec-dot { animation: recBlink 1s steps(1) infinite; }
  .qr-found { animation: qrFound .4s cubic-bezier(.2,.9,.3,1.4); }

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── pixel clip-path ──────────────────────────────────────────
const N = 6;
const clip = (n = N) => `polygon(0 ${n}px,${n}px ${n}px,${n}px 0,calc(100% - ${n}px) 0,calc(100% - ${n}px) ${n}px,100% ${n}px,100% calc(100% - ${n}px),calc(100% - ${n}px) calc(100% - ${n}px),calc(100% - ${n}px) 100%,${n}px 100%,${n}px calc(100% - ${n}px),0 calc(100% - ${n}px))`;

// ── PixelPanel ───────────────────────────────────────────────
function PP({ children, color='var(--panel)', border='var(--line)', pad=14, glow, style={}, onClick, n=N }) {
  return (
    <div onClick={onClick} style={{ position:'relative', clipPath:clip(n), background:border, filter:glow?`drop-shadow(0 0 10px ${glow})`:'none', cursor:onClick?'pointer':'default', padding:2.5, display:'flex', ...style }}>
      <div style={{ clipPath:clip(n-1<2?2:n-1), background:'var(--bg)', flex:1, minWidth:0, minHeight:0, display:'flex' }}>
        <div style={{ background:color, padding:pad, flex:1, minWidth:0, minHeight:0, display:'flex', flexDirection:'column' }}>{children}</div>
      </div>
    </div>
  );
}

// ── PixelButton ──────────────────────────────────────────────
function PB({ children, onClick, kind='portal', size='md', full, disabled, style={} }) {
  const T = { portal:{bg:'var(--portal)',edge:'#3D2E8A',txt:'#fff'}, cyan:{bg:'var(--cyan)',edge:'#0A6E94',txt:'#04222E'}, gold:{bg:'var(--gold)',edge:'#A6820A',txt:'#2A2100'}, danger:{bg:'var(--danger)',edge:'#9B1E3C',txt:'#fff'}, ghost:{bg:'rgba(255,255,255,.06)',edge:'rgba(255,255,255,.18)',txt:'var(--ink)'} };
  const t = T[kind]||T.portal;
  const pads = {sm:'8px 12px',md:'13px 18px',lg:'17px 22px'};
  const fs = {sm:11,md:13,lg:15};
  return (
    <button onClick={disabled?undefined:onClick} disabled={disabled} style={{ position:'relative', clipPath:clip(5), border:'none', background:t.edge, padding:0, width:full?'100%':'auto', cursor:disabled?'not-allowed':'pointer', opacity:disabled?.45:1, fontFamily:'inherit', ...style }}>
      <div style={{ clipPath:clip(4), background:t.bg, color:t.txt, margin:'2px 2px 4px', padding:pads[size], display:'flex', alignItems:'center', justifyContent:'center', gap:8, fontFamily:'var(--fp)', fontSize:fs[size], letterSpacing:.5, textShadow:(kind==='portal'||kind==='danger')?'1px 1px 0 rgba(0,0,0,.3)':'none' }}>
        {children}
      </div>
    </button>
  );
}

// ── HealthBar ────────────────────────────────────────────────
function HealthBar({ hp, maxHp, color='var(--danger)', height=18 }) {
  const pct = Math.max(0, Math.min(100, (hp/maxHp)*100));
  return (
    <div style={{ position:'relative', clipPath:clip(3), background:'#000', padding:2 }}>
      <div style={{ position:'relative', height, background:'rgba(255,255,255,.06)', clipPath:clip(2), overflow:'hidden' }}>
        <div style={{ position:'absolute', inset:0, width:pct+'%', background:`linear-gradient(180deg,${color},color-mix(in srgb,${color} 60%,#000))`, transition:'width .5s cubic-bezier(.2,.8,.2,1)', boxShadow:`0 0 10px ${color}` }} />
        <div style={{ position:'absolute', inset:0, background:'repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.18) 6px 7px)' }} />
      </div>
    </div>
  );
}

// ── Chip ─────────────────────────────────────────────────────
function Chip({ children, color='var(--cyan)', solid }) {
  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontFamily:'var(--fp)', fontSize:8.5, letterSpacing:.5, padding:'5px 8px', clipPath:clip(3), background:solid?color:`color-mix(in srgb,${color} 18%,transparent)`, color:solid?'#0A0820':color, border:solid?'none':`1px solid color-mix(in srgb,${color} 45%,transparent)` }}>
      {children}
    </span>
  );
}

// ── Sigil SVG ────────────────────────────────────────────────
function Sigil({ color='#9D7BFF', size=30, dim }) {
  return (
    <svg width={size} height={size} viewBox="0 0 16 16" style={{ imageRendering:'pixelated', opacity:dim?.25:1, filter:dim?'none':`drop-shadow(0 0 4px ${color})` }}>
      <rect x="7" y="1" width="2" height="2" fill={color}/>
      <rect x="5" y="3" width="6" height="2" fill={color}/>
      <rect x="3" y="5" width="2" height="6" fill={color}/>
      <rect x="11" y="5" width="2" height="6" fill={color}/>
      <rect x="6" y="6" width="4" height="4" fill={dim?color:'#fff'} opacity={dim?.5:.9}/>
      <rect x="5" y="11" width="6" height="2" fill={color}/>
      <rect x="7" y="13" width="2" height="2" fill={color}/>
    </svg>
  );
}

// ── Pixel Icons ───────────────────────────────────────────────
function Icon({ name, size=22, color='currentColor' }) {
  const c = color;
  const paths = {
    map:     <g fill={c}><rect x="2" y="3" width="4" height="14"/><rect x="7" y="2" width="4" height="14"/><rect x="14" y="3" width="4" height="14"/></g>,
    scroll:  <g fill={c}><rect x="3" y="3" width="14" height="2"/><rect x="3" y="15" width="14" height="2"/><rect x="5" y="5" width="10" height="10" opacity=".5"/><rect x="7" y="8" width="6" height="1.5"/><rect x="7" y="11" width="4" height="1.5"/></g>,
    sword:   <g fill={c}><rect x="9" y="2" width="2" height="9"/><rect x="6" y="11" width="8" height="2"/><rect x="8" y="13" width="4" height="4"/></g>,
    trophy:  <g fill={c}><rect x="5" y="2" width="10" height="2"/><rect x="4" y="4" width="2" height="5"/><rect x="14" y="4" width="2" height="5"/><rect x="6" y="4" width="8" height="6"/><rect x="8" y="11" width="4" height="3"/><rect x="6" y="15" width="8" height="2"/></g>,
    user:    <g fill={c}><rect x="7" y="3" width="6" height="6"/><rect x="4" y="11" width="12" height="6"/></g>,
    qr:      <g fill={c}><rect x="2" y="2" width="6" height="6"/><rect x="4" y="4" width="2" height="2" fill="var(--bg)"/><rect x="12" y="2" width="6" height="6"/><rect x="14" y="4" width="2" height="2" fill="var(--bg)"/><rect x="2" y="12" width="6" height="6"/><rect x="4" y="14" width="2" height="2" fill="var(--bg)"/><rect x="12" y="12" width="3" height="3"/><rect x="16" y="15" width="2" height="3"/><rect x="12" y="16" width="3" height="2"/></g>,
    skull:   <g fill={c}><rect x="4" y="3" width="12" height="9"/><rect x="6" y="6" width="2" height="2" fill="var(--bg)"/><rect x="12" y="6" width="2" height="2" fill="var(--bg)"/><rect x="5" y="12" width="3" height="3"/><rect x="9" y="12" width="2" height="3"/><rect x="12" y="12" width="3" height="3"/></g>,
    bolt:    <g fill={c}><rect x="9" y="2" width="4" height="6"/><rect x="6" y="8" width="6" height="2"/><rect x="7" y="10" width="4" height="6"/></g>,
    team:    <g fill={c}><rect x="3" y="4" width="4" height="4"/><rect x="2" y="9" width="6" height="5"/><rect x="11" y="4" width="4" height="4"/><rect x="10" y="9" width="6" height="5"/></g>,
    portal:  <g fill={c}><rect x="6" y="2" width="6" height="2"/><rect x="4" y="4" width="2" height="10"/><rect x="12" y="4" width="2" height="10"/><rect x="6" y="14" width="6" height="2"/><rect x="7" y="6" width="4" height="6" opacity=".5"/></g>,
    lock:    <g fill={c}><rect x="6" y="8" width="8" height="8"/><rect x="7" y="4" width="6" height="2"/><rect x="6" y="6" width="2" height="2"/><rect x="12" y="6" width="2" height="2"/><rect x="9" y="11" width="2" height="3" fill="var(--bg)"/></g>,
    check:   <g fill={c}><rect x="7" y="12" width="2" height="2"/><rect x="5" y="10" width="2" height="2"/><rect x="9" y="10" width="2" height="2"/><rect x="11" y="8" width="2" height="2"/><rect x="13" y="6" width="2" height="2"/></g>,
    clock:   <g fill={c}><rect x="6" y="3" width="6" height="2"/><rect x="4" y="5" width="2" height="8"/><rect x="14" y="5" width="2" height="8"/><rect x="6" y="13" width="6" height="2"/><rect x="9" y="6" width="1.5" height="4"/><rect x="9" y="9" width="3" height="1.5"/></g>,
    star:    <g fill={c}><rect x="9" y="2" width="2" height="4"/><rect x="7" y="6" width="6" height="2"/><rect x="3" y="8" width="14" height="2"/><rect x="5" y="10" width="4" height="2"/><rect x="11" y="10" width="4" height="2"/><rect x="4" y="12" width="3" height="3"/><rect x="13" y="12" width="3" height="3"/></g>,
    map2:    <g fill={c}><rect x="2" y="3" width="4" height="14"/><rect x="7" y="2" width="4" height="14"/><rect x="14" y="3" width="4" height="14"/></g>,
  };
  return <svg width={size} height={size} viewBox="0 0 20 20" style={{ imageRendering:'pixelated', display:'block' }}>{paths[name]||paths.star}</svg>;
}

// ── Portal FX ────────────────────────────────────────────────

        <div key={i} className="portal-ring" style={{ position:'absolute', inset:i*(size*.07), borderRadius:'50%', border:`${4-i*.5}px solid color-mix(in srgb,var(--portal) ${70-i*12}%,transparent)`, boxShadow:`0 0 20px var(--portal),inset 0 0 16px var(--portal)`, animation:`portalSpin ${6+i*2}s linear infinite ${i%2?'reverse':''}` }} />

}

// ── Story Screen ─────────────────────────────────────────────
function StoryScreen() {
  const [chIdx, setChIdx] = useState(0);
  const [idx, setIdx] = useState(0);
  const [typed, setTyped] = useState('');
  const ch = STORY[chIdx];
  const lines = ch.lines;
  const cur = lines[idx];

  useEffect(() => {
    setTyped('');
    let i = 0;
    const t = setInterval(() => { i++; setTyped(cur.slice(0,i)); if(i>=cur.length) clearInterval(t); }, 28);
    return () => clearInterval(t);
  }, [chIdx, idx]);

  const finished = typed.length >= cur.length;
  const next = () => { if(!finished){setTyped(cur);return;} if(idx<lines.length-1) setIdx(i=>i+1); };
  const prev = () => { if(idx>0) setIdx(i=>i-1); };

  return (
    <div style={{ padding:'6px 16px 24px', minHeight:'100%', display:'flex', flexDirection:'column', gap:14 }}>
      {STORY.length > 1 && (
        <div style={{ display:'flex', gap:6, overflowX:'auto', paddingBottom:2 }} className="scroll">
          {STORY.map((c,i) => (
            <button key={c.id} className="chapter-tab" onClick={()=>{setChIdx(i);setIdx(0);}} style={{ flexShrink:0, padding:'6px 10px', clipPath:clip(3), border:'none', cursor:'pointer', background:i===chIdx?'var(--portal)':'rgba(255,255,255,.04)', color:i===chIdx?'#fff':'var(--muted)', fontFamily:'var(--fp)', fontSize:9, lineHeight:1, letterSpacing:1 }}>{c.chapter}</button>
          ))}
        </div>
      )}
      <div>
        <div style={{ fontFamily:'var(--fp)', fontSize:9, color:'var(--portal)', letterSpacing:1.5, lineHeight:1 }}>{ch.chapter}</div>
        <h2 style={{ fontFamily:'var(--fd)', fontWeight:900, fontSize:24, color:'#fff', margin:'6px 0 0' }}>{ch.title}</h2>
      </div>
      <div className="placeholder-art" style={{ height:120, clipPath:clip(6), position:'relative', overflow:'hidden', flexShrink:0 }}>
        <PortalFX size={100} />
        <div style={{ position:'absolute', bottom:6, left:10, fontFamily:'var(--fm)', fontSize:9, color:'rgba(255,255,255,.45)' }}>[ 章節插畫 ]</div>
        <div style={{ position:'absolute', top:8, right:10, fontFamily:'var(--fp)', fontSize:8, lineHeight:1, color:'var(--cyan)', letterSpacing:1 }}>{String(idx+1).padStart(2,'0')}/{String(lines.length).padStart(2,'0')}</div>
      </div>
      <PP pad={16} color="rgba(10,8,28,.7)" border="var(--gold)" style={{ flex:1, minHeight:130 }}>
        <p style={{ margin:0, fontSize:15, lineHeight:1.9, color:'var(--ink)', fontWeight:500 }}>
          {typed}{!finished && <span className="typewriter-caret" />}
        </p>
      </PP>
      <div style={{ display:'flex', gap:10, alignItems:'center' }}>
        <button onClick={prev} disabled={idx===0} style={{ padding:'10px 12px', clipPath:clip(3), border:'none', cursor:idx===0?'not-allowed':'pointer', background:'rgba(255,255,255,.05)', color:idx===0?'rgba(255,255,255,.2)':'var(--muted)', fontFamily:'var(--fp)', fontSize:11, lineHeight:1 }}>◂</button>
        <div style={{ flex:1, display:'flex', gap:3 }}>
          {lines.map((_,i) => <div key={i} style={{ flex:1, height:4, background:i<=idx?'var(--cyan)':'rgba(255,255,255,.08)', clipPath:clip(1) }} />)}
        </div>
        {idx < lines.length-1
          ? <PB kind="gold" onClick={next}>{finished?'繼續 ▸':'▸▸'}</PB>
          : <PB kind="portal" onClick={()=>setIdx(0)}>↻ 重看</PB>}
      </div>
    </div>
  );
}

// ── Task Screen ──────────────────────────────────────────────
function TaskScreen({ code, stationStatus, onQR, onBoss, onClose }) {
  const st = STATIONS.find(s=>s.code===code);
  if(!st) return <div style={{ padding:40, color:'var(--muted)', textAlign:'center' }}>找不到站點<br/><PB kind="ghost" onClick={onClose} style={{marginTop:16}}>返回地圖</PB></div>;
  const boss = BOSSES[st.bossId];
  const status = stationStatus[code] || 'locked';
  const cleared = status === 'cleared';
  const [hint, setHint] = useState(false);
  const [left, setLeft] = useState(st.task.timeLimit);
  useEffect(() => {
    if(cleared) return;
    const t = setInterval(() => setLeft(l => l>0?l-1:0), 1000);
    return () => clearInterval(t);
  }, [cleared]);
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

  return (
    <div style={{ minHeight:'100%', display:'flex', flexDirection:'column' }}>

        <div style={{ position:'absolute', inset:0, background:'repeating-linear-gradient(45deg,transparent 0 14px,rgba(255,255,255,.02) 14px 28px)' }} />

            <div style={{ fontFamily:'var(--fd)', fontWeight:900, fontSize:22, color:'#fff', lineHeight:1.1 }}>{st.name}站</div>
            <div style={{ fontSize:11, color:'rgba(255,255,255,.7)' }}>{st.chapter} · {st.chapterTitle}</div>

        <div style={{ display:'flex', gap:12 }}>

              <Icon name="clock" size={16} color={left<120&&!cleared?'var(--danger)':'var(--cyan)'} />

          <PB kind="cyan" size="lg" full onClick={()=>onQR(code)}><Icon name="qr" size={18} color="#04222E" /> 掃描 QR 解鎖線索</PB>
          <PB kind={cleared?'ghost':'danger'} size="lg" full onClick={()=>onBoss(st.bossId,code)}>
            <Icon name="skull" size={18} color={cleared?'var(--ink)':'#fff'} /> {cleared?`回顧 ${boss.name}`:`挑戰 ${boss.name}`}
          </PB>
        </div>
      </div>
    </div>
  );
}

// ── QR Screen ────────────────────────────────────────────────

            <div style={{ position:'relative', width:220, height:220 }}>

              </div>
            </div>
            <div style={{ position:'absolute', bottom:90, textAlign:'center', width:'100%' }}>
              <div style={{ fontFamily:'var(--fp)', fontSize:11, color:'#fff', lineHeight:1 }}>對準能量結晶 QR…</div>

            </div>
          </>
        ) : (
          <div className="qr-found" style={{ textAlign:'center', padding:24 }}>
            <div style={{ filter:'drop-shadow(0 0 16px var(--cyan))' }}><Sigil color="var(--cyan)" size={70} /></div>
            <div style={{ fontFamily:'var(--fp)', fontSize:13, color:'var(--cyan)', marginTop:18, lineHeight:1 }}>線索已解鎖！</div>

              <div style={{ fontFamily:'var(--fp)', fontSize:8, color:'var(--cyan)', marginBottom:8, lineHeight:1 }}>解碼訊息</div>
              <p style={{ margin:0, fontSize:13, lineHeight:1.7, color:'var(--ink)' }}>{st?st.task.hint:'一段被加密的座標，指向下一個封印節點。'}</p>

// ── Boss Screen ──────────────────────────────────────────────
function BossScreen({ bossId, code, defeatedBosses, onClose, onVictory }) {
  const boss = BOSSES[bossId];
  const st = code ? STATIONS.find(s=>s.code===code) : null;
  if(!boss) return <div style={{ padding:40, color:'var(--muted)', textAlign:'center' }}>找不到守衛<br/><PB kind="ghost" onClick={onClose} style={{marginTop:16}}>撤退</PB></div>;
  const alreadyDefeated = defeatedBosses.includes(bossId);
  const startHp = alreadyDefeated ? Math.round(boss.maxHp*.6) : boss.maxHp;
  const [phase, setPhase] = useState('intro');
  const [hp, setHp] = useState(startHp);
  const [combo, setCombo] = useState(0);
  const [weak, setWeak] = useState(false);
  const [shake, setShake] = useState(false);
  const [floats, setFloats] = useState([]);
  const [bossAct, setBossAct] = useState(boss.skills[0]);
  const idRef = useRef(0);

  useEffect(() => {
    if(phase!=='battle') return;
    let alive = true; const timers = [];
    const loop = () => {
      if(!alive) return;
      setBossAct(boss.skills[Math.floor(Math.random()*boss.skills.length)]);
      setWeak(false);
      const t1 = setTimeout(() => {
        if(!alive) return;
        setWeak(true); setBossAct('破綻！');
        const t2 = setTimeout(() => { if(alive) loop(); }, 2200);
        timers.push(t2);
      }, 1800+Math.random()*1200);
      timers.push(t1);
    };
    loop();
    return () => { alive=false; timers.forEach(clearTimeout); };
  }, [phase]);

  const hit = () => {
    if(phase!=='battle') return;
    const crit = weak;
    const dmg = crit ? 220+Math.floor(Math.random()*120) : 70+Math.floor(Math.random()*60);
    const id = ++idRef.current;
    setFloats(f=>[...f,{id,dmg,crit,x:30+Math.random()*40}]);
    setTimeout(()=>setFloats(f=>f.filter(x=>x.id!==id)),900);
    setShake(true); setTimeout(()=>setShake(false),180);
    setCombo(c=>crit?c+1:0);
    if(weak) setWeak(false);
    setHp(h=>{ const nh=Math.max(0,h-dmg); if(nh===0) setTimeout(()=>setPhase('victory'),600); return nh; });
  };

  if(phase==='intro') return (
    <div className="boss-bg" style={{ minHeight:'100%', display:'flex', flexDirection:'column', padding:'20px 18px 26px', position:'relative', overflow:'hidden' }}>
      <button onClick={onClose} style={{ background:'none', border:'none', color:'var(--muted)', fontFamily:'var(--fp)', fontSize:10, cursor:'pointer', alignSelf:'flex-start', padding:0, lineHeight:1 }}>◂ 撤退</button>
      <div style={{ textAlign:'center', marginTop:14 }}>
        <div style={{ fontFamily:'var(--fp)', fontSize:9, color:'var(--danger)', letterSpacing:2, lineHeight:1 }}>BOSS BATTLE</div>
        {st && <div style={{ fontSize:11, color:'var(--muted)', marginTop:6 }}>{st.code} {st.name}站 · {st.chapterTitle}</div>}
      </div>
      <div style={{ margin:'20px auto 6px', position:'relative' }}>
        <div className="placeholder-art boss-sprite" style={{ width:172, height:172, clipPath:clip(8), display:'flex', alignItems:'center', justifyContent:'center', position:'relative', boxShadow:`0 0 40px color-mix(in srgb,${boss.sigilColor} 50%,transparent)` }}>
          <Icon name="skull" size={84} color={boss.sigilColor} />
          <div style={{ position:'absolute', bottom:7, fontFamily:'var(--fm)', fontSize:9, color:'rgba(255,255,255,.45)' }}>[ BOSS 立繪 ]</div>
        </div>
      </div>
      <h2 style={{ fontFamily:'var(--fp)', fontSize:18, color:'#fff', textAlign:'center', margin:'8px 0 2px', textShadow:`0 0 16px ${boss.sigilColor}`, lineHeight:1.5 }}>{boss.name}</h2>
      <div style={{ fontFamily:'var(--fp)', fontSize:9, color:boss.sigilColor, textAlign:'center', letterSpacing:2, lineHeight:1 }}>{boss.en}</div>
      <PP pad={14} color="rgba(10,8,28,.7)" border="var(--line)" style={{ marginTop:16 }}>
        <p style={{ margin:0, fontSize:13, lineHeight:1.75, color:'var(--ink)' }}>{boss.story}</p>
        <div style={{ display:'flex', flexWrap:'wrap', gap:7, marginTop:12 }}>
          {boss.skills.map(s=><Chip key={s} color="var(--danger)">{s}</Chip>)}
        </div>
        <div style={{ marginTop:12, display:'flex', alignItems:'center', gap:8, padding:'9px 11px', clipPath:clip(4), background:'rgba(255,215,0,.08)' }}>
          <span style={{ fontSize:14 }}>🎯</span>
          <span style={{ fontSize:12, color:'var(--gold)' }}>弱點：{boss.weakness}</span>
        </div>
      </PP>
      <div style={{ marginTop:'auto', paddingTop:18 }}>
        <PB kind="danger" size="lg" full onClick={()=>{setHp(startHp);setCombo(0);setPhase('battle');}}>
          <Icon name="sword" size={18} /> {alreadyDefeated?'重溫戰鬥':'開始戰鬥！'}
        </PB>
      </div>
    </div>
  );

  if(phase==='victory') return (
    <div className="boss-bg victory-bg" style={{ minHeight:'100%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:24, textAlign:'center', position:'relative', overflow:'hidden' }}>
      {[...Array(14)].map((_,i)=>(
        <div key={i} className="confetti" style={{ position:'absolute', width:8, height:8, background:[boss.sigilColor,'var(--gold)','var(--cyan)'][i%3], left:`${(i*13)%100}%`, top:'-10px', animationDelay:`${i*.12}s` }} />
      ))}
      <div style={{ fontFamily:'var(--fp)', fontSize:22, color:'var(--gold)', textShadow:'0 0 20px var(--gold)', lineHeight:1 }}>VICTORY!</div>
      <div style={{ fontFamily:'var(--fd)', fontWeight:900, fontSize:17, color:'#fff', marginTop:10 }}>{boss.name} 已被淨化</div>
      <div className="sigil-drop" style={{ margin:'24px 0 6px' }}><Sigil color={boss.sigilColor} size={90} /></div>
      <div style={{ fontFamily:'var(--fp)', fontSize:11, color:boss.sigilColor, lineHeight:1 }}>獲得「{boss.sigil}」</div>
      <PP pad={14} color="rgba(10,8,28,.7)" border="var(--gold)" style={{ marginTop:22, width:'100%' }}>
        <div style={{ display:'flex', justifyContent:'space-around' }}>
          {[['魂力分',`+${st?st.task.points:180}`,'var(--gold)'],['最高連擊',`x${Math.max(1,combo)}`,'var(--cyan)'],['印記碎片','+1',boss.sigilColor]].map(([l,v,c])=>(
            <div key={l}>
              <div style={{ fontFamily:'var(--fp)', fontSize:15, color:c, lineHeight:1 }}>{v}</div>
              <div style={{ fontSize:10, color:'var(--muted)', marginTop:5 }}>{l}</div>
            </div>
          ))}
        </div>
      </PP>
      <div style={{ marginTop:22, width:'100%', display:'flex', flexDirection:'column', gap:10 }}>
        <PB kind="gold" size="lg" full onClick={()=>onVictory(bossId)}>領取獎勵，前往下一站</PB>
        <PB kind="ghost" full onClick={onClose}>返回地圖</PB>
      </div>
    </div>
  );

  return (
    <div className="boss-bg" style={{ minHeight:'100%', display:'flex', flexDirection:'column', position:'relative', overflow:'hidden' }}>
      <div style={{ padding:'14px 16px 10px' }}>
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', marginBottom:7 }}>
          <span style={{ fontFamily:'var(--fp)', fontSize:12, color:'#fff', textShadow:`0 0 10px ${boss.sigilColor}`, lineHeight:1 }}>{boss.name}</span>
          <span style={{ fontFamily:'var(--fp)', fontSize:11, color:'var(--danger)', lineHeight:1 }}>{hp}<span style={{ color:'var(--muted)', fontSize:9 }}>/{boss.maxHp}</span></span>
        </div>
        <HealthBar hp={hp} maxHp={boss.maxHp} height={20} />
        <div style={{ textAlign:'center', marginTop:12, height:22 }}>
          <span className={weak?'weak-flash':''} style={{ fontFamily:'var(--fp)', fontSize:10, color:weak?'var(--gold)':'rgba(255,255,255,.65)', letterSpacing:1, lineHeight:1 }}>
            {weak?'⚡ 破綻出現！全力攻擊！':`${boss.name}使用「${bossAct}」`}
          </span>
        </div>
      </div>
      <div style={{ flex:1, position:'relative', display:'flex', alignItems:'center', justifyContent:'center' }}>
        {floats.map(f=>(
          <div key={f.id} className="dmg-float" style={{ position:'absolute', top:'38%', left:f.x+'%', fontFamily:'var(--fp)', fontSize:f.crit?21:14, color:f.crit?'var(--gold)':'#fff', textShadow:'2px 2px 0 #000', zIndex:6, lineHeight:1 }}>
            {f.crit?`會心 ${f.dmg}!`:f.dmg}
          </div>
        ))}
        <div onClick={hit} className={`boss-sprite ${shake?'boss-hit':''} ${weak?'boss-weak':''}`} style={{ cursor:'pointer', position:'relative' }}>
          <div className="placeholder-art" style={{ width:182, height:182, clipPath:clip(8), display:'flex', alignItems:'center', justifyContent:'center', boxShadow:`0 0 ${weak?50:30}px color-mix(in srgb,${weak?'var(--gold)':boss.sigilColor} 55%,transparent)` }}>
            <Icon name="skull" size={94} color={weak?'var(--gold)':boss.sigilColor} />
          </div>
        </div>
      </div>
      <div style={{ padding:'10px 16px 26px' }}>
        {combo>1 && <div style={{ textAlign:'center', marginBottom:10, fontFamily:'var(--fp)', fontSize:13, color:'var(--cyan)', textShadow:'0 0 10px var(--cyan)', lineHeight:1 }}>{combo} COMBO!</div>}
        <PB kind={weak?'gold':'danger'} size="lg" full onClick={hit}>
          <Icon name="sword" size={20} color={weak?'#2A2100':'#fff'} /> {weak?'會心一擊！':'攻擊'}
        </PB>
        <div style={{ textAlign:'center', marginTop:10, fontSize:11, color:'var(--muted)' }}>看準 Boss「破綻」的瞬間連點，造成會心傷害</div>
      </div>
    </div>
  );
}

            <div style={{ display:'flex', alignItems:'center', gap:12 }}>
              <div style={{ width:40, height:40, clipPath:clip(5), background:a.unlocked?'rgba(255,215,0,.15)':'rgba(255,255,255,.04)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, filter:a.unlocked?'drop-shadow(0 0 6px rgba(255,215,0,.4))':'none' }}>
                <Icon name={a.icon} size={22} color={a.unlocked?'var(--gold)':'rgba(255,255,255,.3)'} />
              </div>
              <div style={{ flex:1 }}>
                <div style={{ fontSize:14, fontWeight:800, color:a.unlocked?'var(--ink)':'var(--muted)' }}>{a.name}</div>
                <div style={{ fontSize:11, color:'var(--muted)', marginTop:3 }}>{a.desc}</div>
                {!a.unlocked && a.progress!=null && (
                  <div style={{ marginTop:7, height:6, background:'rgba(0,0,0,.3)', clipPath:clip(2) }}>
                    <div style={{ height:'100%', width:`${(a.progress/a.total)*100}%`, background:'var(--gold)' }} />
                  </div>
                )}
              </div>
              {a.unlocked && <Icon name="check" size={20} color="var(--gold)" />}
            </div>
          </PP>
        ))}
      </div>

      <div style={{ fontFamily:'var(--fp)', fontSize:10, color:'var(--ink)', margin:'20px 0 10px', letterSpacing:1, lineHeight:1 }}>▸ 顯示設定</div>
      <PP pad={14} color="var(--panel)" border="var(--line)">
        <div style={{ display:'flex', flexDirection:'column', gap:12 }}>
          {[{k:'noFx',label:'降低動效',desc:'關閉脈動 / 飄字等動畫'}].map(t=>{
            const on = !!prefs[t.k];
            return (
              <div key={t.k} style={{ display:'flex', alignItems:'center', gap:12 }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:700, color:'var(--ink)' }}>{t.label}</div>
                  <div style={{ fontSize:11, color:'var(--muted)', marginTop:3 }}>{t.desc}</div>
                </div>
                <button onClick={()=>setPrefs(p=>({...p,[t.k]:!on}))} style={{ position:'relative', width:44, height:24, padding:0, border:'none', cursor:'pointer', clipPath:clip(3), background:on?'var(--cyan)':'rgba(255,255,255,.1)' }}>
                  <div style={{ position:'absolute', top:3, left:on?22:3, width:18, height:18, clipPath:clip(2), background:on?'#04222E':'rgba(255,255,255,.7)', transition:'left .18s ease' }} />
                </button>
              </div>
            );
          })}
        </div>
      </PP>
    </div>
  );
}

// ── Bottom Nav ────────────────────────────────────────────────
function BottomNav({ tab, setTab, onQR }) {
  const items = [
    { k:'map',   label:'地圖', icon:'map'    },
    { k:'story', label:'劇情', icon:'scroll' },
    { k:'qr',    label:'掃描', icon:'qr',  center:true },
    { k:'rank',  label:'排行', icon:'trophy' },
    { k:'me',    label:'我的', icon:'user'   },
  ];
  return (
    <div style={{ position:'relative', display:'flex', alignItems:'flex-end', justifyContent:'space-around', padding:'8px 10px 26px', background:'linear-gradient(180deg,rgba(14,11,30,.4),var(--bg) 40%)', borderTop:'1px solid rgba(255,255,255,.06)', backdropFilter:'blur(8px)' }}>
      {items.map(it => {
        if(it.center) return (
          <button key={it.k} onClick={onQR} style={{ position:'relative', top:-16, background:'none', border:'none', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:5 }}>
            <div style={{ width:56, height:56, clipPath:clip(7), background:'linear-gradient(135deg,var(--cyan),var(--portal))', display:'flex', alignItems:'center', justifyContent:'center', boxShadow:'0 0 18px rgba(0,200,255,.5)', border:'2px solid rgba(255,255,255,.2)' }}>
              <Icon name="qr" size={26} color="#fff" />
            </div>
            <span style={{ fontFamily:'var(--fp)', fontSize:8, color:'var(--cyan)', lineHeight:1 }}>{it.label}</span>
          </button>
        );
        const on = tab===it.k;
        return (
          <button key={it.k} onClick={()=>setTab(it.k)} style={{ background:'none', border:'none', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:5, padding:'4px 8px', flex:1 }}>
            <Icon name={it.icon} size={22} color={on?'var(--cyan)':'rgba(255,255,255,.4)'} />
            <span style={{ fontFamily:'var(--fp)', fontSize:8, color:on?'var(--cyan)':'rgba(255,255,255,.4)', lineHeight:1 }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

// ── Top Bar ───────────────────────────────────────────────────
function TopBar({ tab, soul }) {
  const titles = { map:'異界鐵軌', story:'劇情', rank:'英雄榜', me:'勇者檔案' };
  return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', padding:'54px 16px 8px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, minWidth:0 }}>
        <div style={{ width:26, height:26, flexShrink:0, clipPath:clip(3), background:PLAYER.teamColor, display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'var(--fp)', fontSize:11, lineHeight:1, color:'#0A0820' }}>{PLAYER.name[0]}</div>
        <div style={{ fontFamily:'var(--fd)', fontWeight:800, fontSize:16, color:'#fff', whiteSpace:'nowrap', letterSpacing:.5 }}>{titles[tab]||'冒險'}</div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:5, padding:'4px 8px', clipPath:clip(3), background:'rgba(255,255,255,.03)', border:'1px solid rgba(255,215,0,.18)' }}>
        <Icon name="star" size={11} color="var(--gold)" />
        <span style={{ fontFamily:'var(--fp)', fontSize:10, lineHeight:1, color:'var(--gold)' }}>{soul}</span>
      </div>
    </div>
  );
}

// ── Toast ─────────────────────────────────────────────────────
function Toast({ msg }) {
  if(!msg) return null;
  return (
    <div className="toast-in" style={{ position:'absolute', top:60, left:'50%', transform:'translateX(-50%)', zIndex:100, padding:'10px 16px', clipPath:clip(5), background:'rgba(0,200,255,.15)', border:'1px solid var(--cyan)', backdropFilter:'blur(8px)', fontFamily:'var(--fp)', fontSize:10, color:'var(--cyan)', whiteSpace:'nowrap', lineHeight:1 }}>
      {msg}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────
function App() {
  const [launched, setLaunched] = useState(false);
  const [tab, setTab] = useState('map');
  const [overlay, setOverlay] = useState(null);
  const [toast, setToast] = useState(null);

  const savedState = loadState();
  const [stationStatus, setStationStatus] = useState(savedState?.stationStatus || DEFAULT_STATE.stationStatus);
  const [defeatedBosses, setDefeatedBosses] = useState(savedState?.defeatedBosses || DEFAULT_STATE.defeatedBosses);
  const [ownedSigils, setOwnedSigils] = useState(savedState?.ownedSigils || DEFAULT_STATE.ownedSigils);
  const [soul, setSoul] = useState(savedState?.soul || DEFAULT_STATE.soul);

  useEffect(() => {
    saveState({ stationStatus, defeatedBosses, ownedSigils, soul });
  }, [stationStatus, defeatedBosses, ownedSigils, soul]);

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(null), 2600); };

  const handleVictory = (bossId) => {
    const st = STATIONS.find(s=>s.bossId===bossId);
    if(!st) return;
    setDefeatedBosses(prev => prev.includes(bossId) ? prev : [...prev, bossId]);
    setOwnedSigils(prev => prev.includes(bossId) ? prev : [...prev, bossId]);
    setSoul(prev => prev + (st.task.points||180));
    setStationStatus(prev => {
      const next = { ...prev, [st.code]:'cleared' };
      const idx = STATIONS.findIndex(s=>s.code===st.code);
      if(idx>=0 && idx<STATIONS.length-1) {
        const nxt = STATIONS[idx+1];
        if(next[nxt.code]==='locked') next[nxt.code]='active';
      }
      return next;
    });
    setOverlay(null);
    setTab('me');
    showToast(`✓ 獲得「${BOSSES[bossId].sigil}」！`);
  };

  if(!launched) return (
    <div style={{ height:'100%', background:'var(--bg)', position:'relative', overflow:'auto' }} className="scroll">
      <PortalScreen
        onStart={()=>setLaunched(true)}
        onStory={()=>{setLaunched(true);setTab('story');}}
        onRank={()=>{setLaunched(true);setTab('rank');}}
      />
    </div>
  );

  return (
    <div style={{ height:'100%', background:'var(--bg)', position:'relative', display:'flex', flexDirection:'column', overflow:'hidden' }}>
      <TopBar tab={tab} soul={soul} />
      <div className="scroll" style={{ flex:1, overflow:'auto' }}>
        {tab==='map'   && <MapScreen stationStatus={stationStatus} defeatedBosses={defeatedBosses} ownedSigils={ownedSigils} onStation={code=>setOverlay({type:'task',code})} />}
        {tab==='story' && <StoryScreen />}
        {tab==='rank'  && <RankScreen />}
        {tab==='me'    && <MeScreen ownedSigils={ownedSigils} defeatedBosses={defeatedBosses} soul={soul} />}
      </div>
      <BottomNav tab={tab} setTab={setTab} onQR={()=>setOverlay({type:'qr',code:null})} />
      <Toast msg={toast} />
      {overlay && (
        <div className="overlay-enter" style={{ position:'absolute', inset:0, zIndex:40, background:'var(--bg)', overflow:'auto' }} className="scroll overlay-enter">
          {overlay.type==='task' && <TaskScreen code={overlay.code} stationStatus={stationStatus} onClose={()=>setOverlay(null)} onQR={code=>setOverlay({type:'qr',code})} onBoss={(bid,code)=>setOverlay({type:'boss',bossId:bid,code})} />}
          {overlay.type==='qr'   && <QRScreen code={overlay.code} onClose={()=>setOverlay(null)} onUnlocked={()=>setOverlay(null)} />}
          {overlay.type==='boss' && <BossScreen bossId={overlay.bossId} code={overlay.code} defeatedBosses={defeatedBosses} onClose={()=>setOverlay(null)} onVictory={handleVictory} />}
        </div>
      )}
    </div>
  );
}

// ── iOS Device Frame ──────────────────────────────────────────
function IOSDevice() {
  return (
    <div className="ios-device">
      <div className="ios-pill" />
      <div className="ios-screen">
        <App />
      </div>
    </div>
  );
}

// ── Scale to fit viewport ─────────────────────────────────────
function fit() {
  const stage = document.getElementById('stage');
  const pad = 40;
  const s = Math.min(1.2, (window.innerHeight-pad)/880, (window.innerWidth-pad)/410);
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);

// Apply persisted prefs
try {
  const p = JSON.parse(localStorage.getItem('puren_prefs_v1') || '{}');
  if(p.noFx) document.body.classList.add('no-fx');
} catch {}

ReactDOM.createRoot(document.getElementById('root')).render(<IOSDevice />);
fit();
</script>
</body>
</html>
